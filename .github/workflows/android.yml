# Builds the Google Play version of the app (unsigned) from android/twa-manifest.json.
# The result is pushed to the "android-build" branch; signing happens offline with the upload key.
name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/twa-manifest.json', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli
      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Generate and build
        working-directory: android
        run: |
          yes | bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json 2>&1 | tee build.log
          yes | bubblewrap build --skipSigning --manifest=./twa-manifest.json 2>&1 | tee -a build.log
          ls -la
      - name: Publish build output to android-build branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp android/*.aab android/*.apk android/build.log /tmp/out/ 2>/dev/null || true
          find android -name "*.aab" -exec cp {} /tmp/out/ \; 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b android-build
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "Android build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-build
