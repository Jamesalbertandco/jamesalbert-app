<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1f3d">
<title>James Albert English Institute®</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f1f3d; --navy-2:#1b2f57; --cream:#f7f1e3; --cream-2:#efe6d0;
    --gold:#c9a24a; --gold-d:#a8842f; --ink:#1d2433; --muted:#6b7385; --white:#fff;
    --r:16px; --shadow:0 6px 20px rgba(15,31,61,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:Poppins,system-ui,sans-serif;background:#e9e4d8;color:var(--ink);display:flex;justify-content:center}
  .phone{width:100%;max-width:430px;height:100dvh;background:var(--white);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.15)}
  header{background:var(--navy);color:var(--cream);padding:calc(env(safe-area-inset-top) + 14px) 16px 14px 20px;display:flex;align-items:center;gap:12px}
  .mono{width:38px;height:38px;flex:none;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:'Playfair Display',serif;color:var(--gold);font-weight:700;font-size:15px;letter-spacing:.5px}
  .brand{line-height:1.15;flex:1;min-width:0}
  .crest{width:46px;height:46px;flex:none;border-radius:50%;box-shadow:0 0 0 1.5px var(--gold)}
  .wordmark{display:block;height:24px;width:auto;margin-bottom:4px}
  .brand span{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
  .lang{display:flex;background:rgba(15,31,61,.55);border:1px solid rgba(255,255,255,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:999px;padding:3px;flex:none}
  .lang button{border:0;background:transparent;color:#fff;font:600 12.5px Poppins,sans-serif;padding:6px 10px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:5px;opacity:.75}
  .lang button.on{background:#fff;color:var(--navy);opacity:1}
  .art{margin:-20px -18px 0;background:#fff}
  .art .back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--navy);font:600 13px Poppins,sans-serif;padding:14px 20px 4px;cursor:pointer}
  .art .hd{padding:6px 20px 0}
  .art .kick{font:600 11px Poppins,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#a3121f;border-top:2px solid var(--navy);padding-top:10px;display:block}
  .art h1.ttl{font-family:'Playfair Display',serif;font-weight:800;font-size:31px;line-height:1.12;color:#111;margin:10px 0 10px}
  .art .dek{font-family:'Source Serif 4',Georgia,serif;font-size:17px;line-height:1.45;color:#444;margin-bottom:14px}
  .art .by{font:500 11.5px Poppins,sans-serif;color:#666;border-top:1px solid #e3e3e3;border-bottom:1px solid #e3e3e3;padding:9px 0;display:flex;justify-content:space-between}
  .art .by b{color:#111;font-weight:600}
  .art figure{margin:16px 0 0}
  .art figure img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
  .art figcaption{font:400 11.5px/1.45 Poppins,sans-serif;color:#777;padding:7px 20px 0}
  .art .bd{padding:14px 20px 8px;font-family:'Source Serif 4',Georgia,serif;font-size:17.5px;line-height:1.62;color:#1a1a1a}
  .art .bd p{margin:0 0 16px}
  .art .bd p.lead:first-letter{float:left;font-family:'Playfair Display',serif;font-weight:700;font-size:62px;line-height:.82;padding:6px 8px 0 0;color:var(--navy)}
  .art blockquote{margin:22px 0;padding:14px 0;border-top:3px solid var(--navy);border-bottom:1px solid #ddd;font-family:'Playfair Display',serif;font-style:italic;font-size:22px;line-height:1.3;color:var(--navy)}
  .art .box{margin:8px 20px 18px;background:#f5f6f8;border-radius:12px;padding:16px 18px}
  .art .box h4{font:600 11px Poppins,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--navy);margin-bottom:10px}
  .art ol{margin:0;padding-left:0;list-style:none;counter-reset:f}
  .art ol li{counter-increment:f;position:relative;padding:10px 0 10px 34px;border-top:1px solid #e3e5ea;font-family:'Source Serif 4',Georgia,serif;font-size:15.5px;line-height:1.5}
  .art ol li:first-child{border-top:0}
  .art ol li:before{content:counter(f);position:absolute;left:0;top:9px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font:600 12px/24px Poppins,sans-serif;text-align:center}
  .art .say div{padding:9px 0;border-top:1px solid #e3e5ea}
  .art .say div:first-of-type{border-top:0}
  .art .say b{display:block;font:600 15px Poppins,sans-serif;color:var(--navy)}
  .art .say span{font:400 13px Poppins,sans-serif;color:#666}
  .art .end{text-align:center;padding:8px 20px 26px;font:400 13.5px Poppins,sans-serif;color:#555}
  .art .end .btn{margin-top:10px}
  .welcome{position:absolute;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 25%,#1d3461 0%,var(--navy) 55%,#0a1428 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 18px) 28px calc(env(safe-area-inset-bottom) + 28px);text-align:center;animation:fade .35s ease}
  .welcome.hide{display:none}
  .welcome .wl{align-self:flex-end}
  .welcome .wmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .welcome .wcrest{width:min(62vw,250px);height:auto;border-radius:50%;box-shadow:0 18px 50px rgba(0,0,0,.35);margin-bottom:26px}
  .welcome h1{font-family:'Playfair Display',serif;font-size:27px;line-height:1.2;color:#fff;margin:0}
  .welcome .wtag{font-size:15px;opacity:.85;margin:6px 0 0}
  .welcome .wbtns{width:100%;display:flex;flex-direction:column;gap:12px}
  .welcome .wbtns a,.welcome .wbtns button{display:block;width:100%;padding:15px;border-radius:30px;font:600 15px Poppins,sans-serif;text-decoration:none;cursor:pointer}
  .welcome .wprim{background:#fff;color:var(--navy);border:0}
  .welcome .wsec{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.7)}
  .welcome .wnote{font-size:12px;opacity:.65;margin-top:14px}
  .disp .mast{text-align:center;padding:16px 20px 12px}
  .disp .mast .top{font:600 10px Poppins,sans-serif;letter-spacing:2.5px;text-transform:uppercase;color:#555;display:flex;justify-content:space-between;border-bottom:1px solid #111;padding-bottom:7px}
  .disp .mast .name{font-family:'Playfair Display',serif;font-weight:800;font-size:46px;line-height:1;color:#111;margin:14px 0 4px;letter-spacing:-.5px}
  .disp .mast .inst{font-family:'Playfair Display',serif;font-style:italic;font-size:15px;color:var(--navy)}
  .disp .mast .bar{margin-top:12px;border-top:3px double #111;border-bottom:1px solid #111;padding:6px 0;font:500 11px Poppins,sans-serif;color:#333;display:flex;justify-content:space-between;gap:8px}
  .disp .mast .tag{font-family:'Source Serif 4',Georgia,serif;font-style:italic;font-size:14px;color:#444;margin-top:9px}
  .disp .story{border-top:1px solid #e3e3e3;padding-top:4px}
  .disp .story .hd{padding-top:14px}
  .disp .story h2.st{font-family:'Playfair Display',serif;font-weight:700;font-size:24px;line-height:1.18;color:#111;margin:8px 0 6px}
  .disp .story .kick{border-top:0;padding-top:0}
  .disp .story .bd{padding-top:10px}
  .disp .foot{font:600 11px Poppins,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--navy);padding:0 20px 18px}
  .disp .facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#d9dce3;margin:0 20px 18px;border:1px solid #d9dce3}
  .disp .facts div{background:#f5f6f8;padding:10px 12px}
  .disp .facts small{display:block;font:600 10px Poppins,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:#777}
  .disp .facts b{font-family:'Source Serif 4',Georgia,serif;font-size:16px;color:#111}
  .disp .pq{margin:6px 20px 18px;text-align:center;border-top:3px solid var(--navy);border-bottom:1px solid #ddd;padding:18px 6px}
  .disp .pq p{font-family:'Playfair Display',serif;font-style:italic;font-size:26px;line-height:1.25;color:var(--navy);margin:0 0 8px}
  .disp .pq span{font:600 10.5px Poppins,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:#777}
  .disp .past{padding:4px 20px 8px}
  .hwc{position:relative}
  .hwc .badge{margin-left:auto;font:600 10.5px Poppins,sans-serif;padding:4px 9px;border-radius:20px;background:#eef1f6;color:var(--navy);white-space:nowrap}
  .hwc .badge.new{background:#a3121f;color:#fff}
  .hwc .badge.lock{background:#f3f4f6;color:#666}
  .codebox{position:absolute;inset:0;z-index:40;background:rgba(10,20,40,.55);display:flex;align-items:flex-end}
  .codebox.hide{display:none}
  .codebox .sh{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);animation:up .25s ease}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .codebox h3{font-family:'Playfair Display',serif;font-size:21px;color:var(--navy);margin-bottom:4px}
  .codebox p{font-size:13.5px;color:#555;margin-bottom:14px}
  .codebox input{width:100%;font:500 20px Poppins,sans-serif;letter-spacing:4px;text-align:center;padding:13px;border:1.5px solid #cfd5e0;border-radius:14px;outline:none}
  .codebox input:focus{border-color:var(--navy)}
  .codebox .err{color:#a3121f;font-size:13px;min-height:20px;margin:8px 0 4px;text-align:center}
  .codebox .row2{display:flex;gap:10px}
  .codebox .row2 .btn{flex:1}
  .codebox .help{font-size:12.5px;color:#666;text-align:center;margin-top:14px}
  .codebox .help a{color:var(--navy);font-weight:600}
  .hwk .card{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px}
  .hwk .card .top{background:var(--navy);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
  .hwk .card .top b{font:600 11px Poppins,sans-serif;letter-spacing:2px;text-transform:uppercase}
  .hwk .card .top span{font-size:12px;opacity:.8}
  .hwk .card .in{padding:16px 18px 18px}
  .hwk .card h3{font-family:'Playfair Display',serif;font-size:22px;line-height:1.2;color:#111;margin-bottom:8px}
  .hwk .card p{font-family:'Source Serif 4',Georgia,serif;font-size:16px;line-height:1.55;color:#333;margin-bottom:12px}
  .hwk .due{display:inline-block;font:600 12px Poppins,sans-serif;color:var(--navy);background:#eef1f6;border-radius:20px;padding:5px 11px;margin-bottom:14px}
  .hwk .dl{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
  .hwk .empty{background:#f5f6f8;border-radius:16px;padding:22px;text-align:center;color:#555;font-size:14px;margin-bottom:22px}
  .hwk .back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--navy);font:600 13px Poppins,sans-serif;padding:0 0 8px;cursor:pointer}
  .hwk .lockit{display:block;margin:22px auto 6px;border:0;background:none;color:#888;font:500 12.5px Poppins,sans-serif;text-decoration:underline;cursor:pointer}
  .teamg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tcard{background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);display:flex;flex-direction:column}
  .tcard img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
  .tcard .t{padding:10px 12px 13px}
  .tcard b{display:block;font-family:'Playfair Display',serif;font-size:16px;color:#111;line-height:1.2}
  .tcard span{display:block;font-size:11.5px;color:var(--navy);font-weight:600;margin-top:3px}
  .tcard small{display:block;font-size:12px;color:#666;margin-top:5px;line-height:1.4}
  .teamhd p.lead2{font-family:'Source Serif 4',Georgia,serif;font-size:16px;line-height:1.5;color:#444;margin-bottom:18px}
  .tprof .photo{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
  .tprof .facts3{display:grid;grid-template-columns:1fr;gap:1px;background:#e3e5ea;margin:4px 20px 18px;border:1px solid #e3e5ea;border-radius:12px;overflow:hidden}
  .tprof .facts3 div{background:#f5f6f8;padding:9px 14px;display:flex;justify-content:space-between;gap:10px}
  .tprof .facts3 small{font:600 10.5px Poppins,sans-serif;letter-spacing:1.3px;text-transform:uppercase;color:#777;padding-top:2px}
  .tprof .facts3 b{font:500 13.5px Poppins,sans-serif;color:#111;text-align:right}
  .tprof .chips{display:flex;flex-wrap:wrap;gap:7px}
  .tprof .chips span{font:500 12.5px Poppins,sans-serif;background:#eef1f6;color:var(--navy);border-radius:20px;padding:6px 11px}
  .tprof h3.sh{font-family:'Playfair Display',serif;font-size:20px;color:var(--navy);margin:8px 0 8px}
  .notify{background:#eef1f6;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;margin:0 0 18px}
  .notify .bell{font-size:22px}
  .notify .t{flex:1;font-size:13px;color:#333;line-height:1.4}
  .notify .t b{display:block;font-size:14px;color:var(--navy)}
  .notify button{border:0;background:var(--navy);color:#fff;font:600 12.5px Poppins,sans-serif;border-radius:20px;padding:9px 14px;cursor:pointer;white-space:nowrap}
  .notify.on button{background:#fff;color:var(--navy);border:1px solid #cfd5e0}
  .hubc .seg{display:flex;background:#eef1f6;border-radius:14px;padding:4px;gap:4px;margin:4px 0 18px;overflow-x:auto}
  .hubc .seg button{flex:1;border:0;background:none;font:600 12.5px Poppins,sans-serif;color:#555;padding:9px 6px;border-radius:10px;white-space:nowrap;cursor:pointer}
  .hubc .seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .mcard{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;display:block;text-decoration:none;color:inherit;cursor:pointer;border:0;width:100%;text-align:left;padding:0;font:inherit}
  .mcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#f3f4f6}
  .mcard .in{padding:13px 16px 15px}
  .mcard small{font:600 10.5px Poppins,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:#a3121f}
  .mcard b{display:block;font-family:'Playfair Display',serif;font-size:19px;color:#111;margin:3px 0 5px;line-height:1.25}
  .mcard p{font-size:13.5px;color:#555;line-height:1.5;margin:0 0 9px}
  .mcard .go{font:600 12.5px Poppins,sans-serif;color:var(--navy)}
  .mcard.soon{opacity:.6;cursor:default}
  .overlay{position:absolute;inset:0;z-index:45;background:rgba(10,20,40,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}
  .overlay.hide{display:none}
  .overlay .x{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:14px;background:none;border:0;color:#fff;font-size:34px;line-height:1;cursor:pointer}
  .overlay .fcimg{width:100%;max-height:52vh;object-fit:contain;border-radius:14px;background:#fff}
  .overlay .fcw{font-family:'Playfair Display',serif;font-size:32px;color:#fff;margin:14px 0 4px}
  .overlay .fcn{font:600 11px Poppins,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#cfd5e0;margin-bottom:10px}
  .overlay .ctl{display:flex;gap:10px;margin-top:12px}
  .overlay .ctl button{border:0;border-radius:24px;padding:12px 18px;font:600 14px Poppins,sans-serif;cursor:pointer;background:#fff;color:var(--navy)}
  .overlay .ctl button.p{background:#a3121f;color:#fff}
  .overlay .vid{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
  .overlay .vt{color:#fff;font-family:'Playfair Display',serif;font-size:20px;margin-top:12px;text-align:center}
  .rd{position:absolute;inset:0;z-index:46;background:#fffdf8;display:flex;flex-direction:column}
  .rd.hide{display:none}
  .rd .bar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;border-bottom:1px solid #eee}
  .rd .bar b{font-family:'Playfair Display',serif;font-size:15px;color:var(--navy)}
  .rd .bar button{border:0;background:none;font-size:28px;line-height:1;color:var(--navy);cursor:pointer}
  .rd .pg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 20px;text-align:center;overflow:auto}
  .rd .pg img{max-width:100%;max-height:46vh;object-fit:contain}
  .rd .pg p{font-size:21px;line-height:1.45;color:#1d2433;margin-top:16px;font-family:'Andika','Poppins',sans-serif}
  .rd .pg p i{color:#a3121f;font-style:normal}
  .rd .pg p small{font-size:14px;color:#6b7280}
  .rd .ctl{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 14px calc(env(safe-area-inset-bottom) + 14px)}
  .rd .ctl button{border:0;border-radius:26px;padding:12px 18px;font:600 14px Poppins,sans-serif;background:#eef1f6;color:var(--navy);cursor:pointer}
  .rd .ctl .play{background:#a3121f;color:#fff;min-width:110px}
  .rd .ctl .n{font:600 12px Poppins,sans-serif;color:#9aa3b5;min-width:46px}
  .rd .auto{display:flex;align-items:center;gap:6px;justify-content:center;font:500 12px Poppins,sans-serif;color:#666;padding-bottom:4px}
  .bk{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px;cursor:pointer}
  .bk .th{background:#f3f1ec;display:flex;justify-content:center;padding:16px}
  .bk .th img{width:62%;aspect-ratio:2/3;object-fit:cover;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .bk .in{padding:16px 18px 18px}
  .bk .badge2{display:inline-block;background:#0f1f3d;color:#fff;font:600 10px Poppins,sans-serif;letter-spacing:1.6px;text-transform:uppercase;padding:4px 9px;margin-bottom:10px}
  .bk small{display:block;font:600 10.5px Poppins,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:#a3121f;margin-bottom:5px}
  .bk b{display:block;font-family:'Playfair Display',serif;font-size:21px;color:#0f1f3d;margin-bottom:8px}
  .bk p{font-size:13.5px;color:#555;line-height:1.55;margin:0 0 12px}
  .bk .fl{font:600 10px Poppins,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:#a3121f;margin:0 0 3px}
  .bk .fo{font-size:12.5px;color:#565866;margin:0 0 14px}
  .bk .cta{display:flex;gap:8px;flex-wrap:wrap}
  .bk .cta button,.bk .cta a{font:600 12px Poppins,sans-serif;border-radius:20px;padding:9px 13px;border:1px solid #cfd5e0;background:#fff;color:var(--navy);text-decoration:none;cursor:pointer}
  .bk .cta .p{background:#0f1f3d;color:#fff;border-color:#0f1f3d}
  .bookc{display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px;margin-bottom:14px;cursor:pointer;border:0;width:100%;text-align:left;font:inherit}
  .bookc img{width:84px;height:84px;object-fit:contain;background:#fffdf8;border-radius:10px}
  .bookc b{display:block;font-family:'Playfair Display',serif;font-size:17px;color:#111}
  .bookc span{font-size:12.5px;color:#666}
  .bookc em{display:inline-block;margin-top:6px;font:600 12px Poppins,sans-serif;color:var(--navy);font-style:normal}
  .libnote{font-size:11.5px;color:#777;line-height:1.5;background:#f5f6f8;border-radius:12px;padding:10px 12px;margin:4px 0 14px}
  main{flex:1;overflow-y:auto;padding:20px 18px 28px}
  .screen{display:none;animation:fade .25s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-family:'Playfair Display',serif;font-size:26px;color:var(--navy);margin-bottom:4px}
  h2{font-family:'Playfair Display',serif;font-size:19px;color:var(--navy);margin:22px 0 10px}

const hwOpenFor = c => { try { return localStorage.getItem(hwKey(c)) === ((window.HOMEWORK||{})[c]||{}).codeHash; } catch(e){ return false; } };
const hwSeen = c => { try { return localStorage.getItem(hwKey(c) + '-seen') || ''; } catch(e){ return ''; } };

function renderHwList(){

    const d = H[h.code] || {items:[]}, open = hwOpenFor(h.code), latest = (d.items[0]||{}).date || '';

      : (latest && latest > hwSeen(h.code)) ? `<span class="badge new">${esc(T(TEXT.hwNew))}</span>`
      : `<span class="badge">${esc(T(TEXT.hwOpen))}</span>`;
    return `<a class="row hwc" href="#" onclick="hwTap('${h.code}');return false"><div class="ic">${esc(h.code)}</div>
      <div class="t"><b>${esc(T(h.name)).replace(/ Hub$/,'').replace(/^Area /,'')}</b><span>${esc(T(h.info))}${d.teacher ? ' · ' + esc(d.teacher) : ''}</span></div>${badge}</a>`;

let HW_TARGET = 'hwClass';
function hwTap(c, target){ HWC = c; HW_TARGET = target || 'hwClass'; if (hwOpenFor(c)) { go(HW_TARGET); } else { hwAsk(); } }
function hwAsk(){
  const box = document.getElementById('codeBox'), h = CONFIG.hubs.find(x => x.code === HWC);
  box.querySelector('h3').textContent = T(TEXT.hwCodeT) + ' · ' + T(h.name).replace(/ Hub$/,'').replace(/^Area /,'');
  box.querySelector('.err').textContent = ''; const i = box.querySelector('input'); i.value = '';
  box.classList.remove('hide'); setTimeout(() => i.focus(), 50);
}
async function hwCheck(){
  const box = document.getElementById('codeBox'), v = box.querySelector('input').value.trim().toLowerCase();
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(HWC + ':' + v));
  const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  if (hex === ((window.HOMEWORK||{})[HWC]||{}).codeHash) {
    try { localStorage.setItem(hwKey(HWC), hex); } catch(e){}
    box.classList.add('hide'); renderHwList(); renderAll(); go(HW_TARGET);
  } else { box.querySelector('.err').textContent = T(TEXT.hwWrong); }
}
// ---------- Notifications ----------
const nfKey = c => 'ja-nf-' + c;
const nfGet = c => { try { return localStorage.getItem(nfKey(c)) === '1'; } catch(e){ return false; } };
function renderNotifyBoxes(){
  const box = document.getElementById('notifyBox'); if (!box) return;
  const on = nfGet(HWC), blocked = ('Notification' in window) && Notification.permission === 'denied';
  box.classList.toggle('on', on);
  box.innerHTML = `<div class="bell">🔔</div><div class="t"><b>${esc(T(on ? TEXT.nfDone : TEXT.nfT))}</b>${esc(T(blocked && !on ? TEXT.nfBlocked : TEXT.nfS))}</div>
    <button onclick="nfToggle()">${esc(T(on ? TEXT.nfOff : TEXT.nfOn))}</button>`;
}
async function nfToggle(){
  const OS = window.OS_READY, c = HWC;
  if (!OS) { const b = document.querySelector('#notifyBox .t'); if (b) b.lastChild.textContent = LANG === 'it' ? 'Un momento, riprova tra qualche secondo.' : 'One moment, please try again in a few seconds.'; return; }
  if (nfGet(c)) {
    try { await OS.User.removeTag('class_' + c); } catch(e){}
    try { localStorage.removeItem(nfKey(c)); } catch(e){}
  } else {
    try { await OS.Notifications.requestPermission(); } catch(e){}
    if (OS.Notifications.permission) {
      try { await OS.User.PushSubscription.optIn(); } catch(e){}
      try { await OS.User.addTags({ ['class_' + c]: '1', lang: LANG }); } catch(e){}
      try { localStorage.setItem(nfKey(c), '1'); } catch(e){}
    }
  }
  renderNotifyBoxes();
}

      <div class="cta"><button class="p" onclick="${open}">${esc(T(b.link ? TEXT.rdRead : (b.pages && !b.pages.some(p => p.audio)) ? TEXT.rdRead : TEXT.rdOpen))}</button>${b.words ? `<button onclick="rdWords(${i})">${esc(T(TEXT.rdWords))}</button>` : ''}${b.pdf ? `<a href="${b.dir+b.pdf}" target="_blank" rel="noopener">⬇ PDF</a>` : ''}</div></div></div>`; }).join('') : `<div class="empty">${esc(T(TEXT.hbEmpty))}</div>`); }
  if (HUBTAB === 'vid') { const V = (window.VIDEOS||[]).filter(v => !v.classes || v.classes.includes(HWC));
    body = `<div class="libnote">${esc(T(TEXT.vidNote))}</div>` + (V.length ? V.map(v => `<div class="bk"><div class="th" style="padding:0" onclick="vidPlay('${esc(v.source)}','${esc(v.id)}','${esc(v.h||'')}','${esc(v.title).replace(/'/g,"\\'")}')"><img src="${esc(v.image)}" alt="" style="width:100%;aspect-ratio:16/9;border-radius:0;box-shadow:none"></div>
      <div class="in"><span class="badge2">Video</span><small>${esc(v.meta||'')}</small><b>${esc(v.title)}</b><p>${esc(T(v.desc||''))}</p>
      ${v.focus ? `<p class="fl">English learning focus</p><p class="fo">${esc(v.focus)}</p>` : ''}${v.credit ? `<p class="fo" style="font-size:11px;color:#888">${esc(v.credit)}</p>` : ''}
      <div class="cta"><button class="p" onclick="vidPlay('${esc(v.source)}','${esc(v.id)}','${esc(v.h||'')}','${esc(v.title).replace(/'/g,"\\'")}')">${esc(T(TEXT.hbWatch))}</button></div></div></div>`).join('') : `<div class="empty">${esc(T(TEXT.vidEmpty))}</div>`); }
  if (HUBTAB === 'films' || HUBTAB === 'books') body = `<div class="empty">${esc(T(TEXT.hbMoving))}</div>`;
  document.getElementById('hubBody').innerHTML = `
    <button class="back" onclick="renderAll();go('hubs')">‹ ${esc(T(TEXT.artBack))}</button>
    <h1>${esc(T(h.name))}</h1><p class="sub">${esc(T(h.info))}</p>
    <div class="seg">${tabs.map(([k,l]) => `<button class="${k === HUBTAB ? 'on' : ''}" onclick="HUBTAB='${k}';renderHub()">${esc(T(l))}</button>`).join('')}</div>
    ${body}`;
}
function hubOpen(i){
  const m = ((window.HUB||{})[HWC]||{material:[]}).material[i]; if (!m) return;
  if (m.type === 'flash') { fcOpen(); return; }
  if (m.type === 'pdf') { window.open(m.link, '_blank'); return; }
  document.getElementById('vidFrame').src = vimeoEmbed(m.vimeo);
  document.getElementById('vidT').textContent = m.title;
  document.getElementById('vidBox').classList.remove('hide');
}
function vidPlay(src, id, h, title){
  const u = src === 'youtube' ? `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0` : `https://player.vimeo.com/video/${id}?${h ? 'h=' + h + '&' : ''}autoplay=1&title=0&byline=0&portrait=0`;
  document.getElementById('vidFrame').src = u; document.getElementById('vidT').textContent = title;
  document.getElementById('vidBox').classList.remove('hide');
}
function vidClose(){ document.getElementById('vidFrame').src = 'about:blank'; document.getElementById('vidBox').classList.add('hide'); }
let FCI = 0; const FCA = new Audio();
const fcList = () => ((window.HUB||{})[HWC]||{}).flash || [];
function fcSay(){ const d = fcList()[FCI]; if (!d) return; try { FCA.pause(); FCA.src = d.a; FCA.currentTime = 0; const p = FCA.play(); if (p && p.catch) p.catch(()=>{}); } catch(e){} }
function fcShow(i){ const L = fcList(); if (!L.length) return; FCI = (i + L.length) % L.length; const d = L[FCI];
  document.getElementById('fcImg').src = d.i; document.getElementById('fcW').textContent = d.w;
  document.getElementById('fcN').textContent = (LANG === 'it' ? 'Carta ' : 'Card ') + (FCI+1) + ' / ' + L.length; fcSay(); }
function fcOpen(){ document.getElementById('fcBox').classList.remove('hide'); fcShow(0); }
function fcClose(){ FCA.pause(); document.getElementById('fcBox').classList.add('hide'); }

// ---------- Read-along reader ----------
let RDB = null, RDI = 0; const RDA = new Audio(); let RDNEXT = '';
RDA.addEventListener('ended', () => {
  if (RDNEXT) { const n = RDNEXT; RDNEXT = ''; RDA.src = RDB.dir + 'audio/' + n; RDA.play().catch(()=>{}); return; }
  rdBtn(); if (document.getElementById('rdAuto').checked && RDB && RDI < RDB.pages.length - 1) setTimeout(() => rdGo(RDI + 1, true), 700);
});
function rdBtn(){ document.getElementById('rdPlay').textContent = T(RDA.paused ? TEXT.rdListen : TEXT.rdPause); }
function rdGo(i, play){
  if (!RDB) return; RDI = Math.max(0, Math.min(RDB.pages.length - 1, i)); const p = RDB.pages[RDI];
  document.getElementById('rdImg').src = RDB.dir + 'img/' + p.img;
  document.getElementById('rdTxt').innerHTML = p.text;
  document.getElementById('rdN').textContent = (RDI + 1) + ' / ' + RDB.pages.length;
  RDA.pause(); RDNEXT = p.then || ''; const hasA = !!p.audio; document.getElementById('rdPlay').style.display = hasA ? '' : 'none';
  if (hasA) { RDA.src = RDB.dir + 'audio/' + p.audio; if (play !== false) RDA.play().catch(()=>{}); } else RDA.removeAttribute('src'); rdBtn();
}
function rdPlayTgl(){ if (RDA.paused) { if (RDA.ended || !RDA.currentTime) RDA.currentTime = 0; RDA.play().catch(()=>{}); } else RDA.pause(); setTimeout(rdBtn, 50); }
function rdOpen(i){ RDB = LIBRARY[i]; document.getElementById('rdT').textContent = RDB.title; const au = RDB.pages.some(p => p.audio); document.getElementById('rdAuto').parentElement.style.display = au ? '' : 'none'; document.getElementById('rdAutoL').textContent = T(TEXT.rdAuto);
  document.getElementById('reader').classList.remove('hide'); rdGo(0, false); }
function rdClose(){ RDA.pause(); document.getElementById('reader').classList.add('hide'); }
function rdWords(i){ const b = LIBRARY[i]; RDA.pause(); RDNEXT = ''; RDA.src = b.dir + 'audio/' + b.words; RDA.play().catch(()=>{}); }
RDA.addEventListener('play', () => { if (RDB) rdBtn(); }); RDA.addEventListener('pause', () => { if (RDB) rdBtn(); });

let ISSUE = 0;
function renderDispatch(){
  const all = window.DISPATCH || []; if (!all.length) return;
  const d = all[ISSUE] || all[0], t = d[LANG] || d.en, img = f => d.dir + f;
  const fig = s => s.img ? `<figure><img src="${img(s.img)}" alt="" loading="lazy">${s.caption ? `<figcaption>${s.caption}</figcaption>` : ''}</figure>` : '';
  const story = s => {
    if (s.type === 'quote') return `<div class="pq"><p>“${s.text}”</p><span>${s.by}</span></div>`;
    const lead = s.type === 'lead';
    return `<div class="story">
      ${lead ? '' : fig(s)}
      <div class="hd"><span class="kick">${s.kicker}</span>
        ${lead ? `<h1 class="ttl">${s.title}</h1>` : `<h2 class="st">${s.title}</h2>`}
        ${s.dek ? `<p class="dek">${s.dek}</p>` : ''}
        ${s.by ? `<div class="by"><b>${s.by}</b><span>jamesalbert®</span></div>` : ''}</div>
      ${lead ? fig(s) : ''}
      <div class="bd">${s.body.map((p,i) => `<p${lead && i===0 ? ' class="lead"' : ''}>${p}</p>`).join('')}</div>
      ${s.facts ? `<div class="facts">${s.facts.map(([k,v]) => `<div><small>${k}</small><b>${v}</b></div>`).join('')}</div>` : ''}
      ${s.foot ? `<div class="foot">${s.foot}</div>` : ''}
    </div>`;
  };
  const past = all.length > 1 ? `<div class="past"><h2>${esc(T(TEXT.dPast))}</h2><div class="list">${all.map((x,i) => i === ISSUE ? '' :
      `<a class="row" href="#" onclick="ISSUE=${i};renderDispatch();document.getElementById('main').scrollTop=0;return false"><div class="ic">📰</div><div class="t"><b>The Dispatch · ${(x[LANG]||x.en).issue}</b><span>${(x[LANG]||x.en).date}</span></div><span class="chev">›</span></a>`).join('')}</div></div>` : '';
  document.getElementById('dispBody').innerHTML = `
    <button class="back" onclick="go('more')">‹ ${esc(T(TEXT.artBack))}</button>
    <div class="mast">
      <div class="top"><span>San Michele al Tagliamento</span><span>${t.issue}</span></div>
      <div class="name">The Dispatch</div>
      <div class="inst">The jamesalbert® Language Institute</div>
      <div class="bar"><span>${t.date}</span><span>${t.langs}</span></div>
      <div class="tag">${t.tagline}</div>
    </div>
    ${t.stories.map(story).join('')}
    <div class="end">${esc(T(TEXT.dEnd))}<br><button class="btn navy" onclick="go('book')">${esc(T(TEXT.artCta))}</button>
      ${d.pdf ? `<br><a class="btn ghost" style="margin-top:10px" href="${d.pdf}" target="_blank" rel="noopener">${esc(T(TEXT.dPrint))}</a>` : ''}</div>
    ${past}`;
}

function renderAll(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = T(TEXT[el.dataset.t]));
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  document.getElementById('newsList').innerHTML = CONFIG.news.map(n =>
    `<div class="news"><div class="d">${esc(T(n.date))}</div><b>${esc(T(n.title))}</b><p>${esc(T(n.text))}</p></div>`).join('');
  document.getElementById('hubList').innerHTML = CONFIG.hubs.map(h => `<a class="row hwc" href="#" onclick="hwTap('${h.code}','hubClass');return false"><div class="ic">${esc(h.code)}</div><div class="t"><b>${esc(T(h.name))}</b><span>${esc(T(h.info))}</span></div>${hwOpenFor(h.code) ? `<span class="badge">${esc(T(TEXT.hwOpen))}</span>` : `<span class="badge lock">🔒 ${esc(T(TEXT.hwLocked))}</span>`}</a>`).join('');
  renderHwList();
  const lib = [{code:"📖",name:TEXT.nKidsBooks,info:TEXT.kidsBooksS,f:"Kids"},{code:"🎬",name:TEXT.nAdultBooks,info:TEXT.adultBooksS,f:"Adults"}];
  document.getElementById('hubLib').innerHTML = lib.map(it => `<a class="row" href="#" onclick="go('library','${it.f}');return false"><div class="ic">${it.code}</div><div class="t"><b>${esc(T(it.name))}</b><span>${esc(T(it.info))}</span></div><span class="chev">›</span></a>`).join('');
  document.getElementById('contactList').innerHTML = CONFIG.contact.map(h => row(h)).join('');
  renderHome();
  renderMore();
  renderCourses();
  renderLib();
  renderArticle();
  renderLevelTest();
  renderClub();
  renderDispatch();
  renderTeam();
  renderTeacher();
}

function setLang(l){
  LANG = l;
  try { localStorage.setItem('ja-lang', l); } catch(e){}
  renderAll();
}

function go(id, f){
  if (id === 'library') { filter = f || 'All'; renderLib(); }
  if (id === 'article') { ART = f || ART; renderArticle(); }
  if (id === 'hwClass') renderHwClass();
  if (id === 'hubClass') { HUBTAB = HUBTAB || 'week'; renderHub(); }
  if (id === 'team') renderTeam();
  if (id === 'levelTest') renderLevelTest();
  if (id === 'club') renderClub();
  if (id === 'teacher') { TID = f || TID; renderTeacher(); }
  document.querySelector('.phone').classList.toggle('on-home', id === 'home');
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  const tab = {library:'hubs', contact:'more', article:'home', dispatch:'more', hwClass:'homework', team:'home', teacher:'home', levelTest:'home', club:'home', hubClass:'hubs'}[id] || id;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.go === tab));
  document.getElementById('main').scrollTop = 0;
}

document.querySelectorAll('[data-link]').forEach(a => a.href = CONFIG.links[a.dataset.link]);
// Temporary: membership requests open an email to info@ until the in-app form is connected.
document.getElementById('memberBtn').href = 'mailto:info@jamesalbert.it?subject=' + encodeURIComponent('Membership request') +
  '&body=' + encodeURIComponent('Name:\nEmail:\nPhone:\nClass or course:\nIf the student is under 18, parent/guardian name:\n');
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.go, b.dataset.f));

// Welcome screen: shown the first time the app is opened on a device.
(() => {
  const w = document.getElementById('welcomeScreen');
  let seen = false;
  try { seen = localStorage.getItem('ja-welcomed') === '1'; } catch(e){}
  if (new URLSearchParams(location.search).has('welcome')) seen = false;
  const done = () => { w.classList.add('hide'); try { localStorage.setItem('ja-welcomed','1'); } catch(e){} };
  document.getElementById('wMember').href = document.getElementById('memberBtn').href;
  document.getElementById('wMember').addEventListener('click', done);
  document.getElementById('wExplore').onclick = done;
  if (!seen) w.classList.remove('hide');
})();
document.querySelectorAll('img[data-ph]').forEach(img => {
  const swap = () => { const d = document.createElement('div'); d.className = 'ph'; d.textContent = 'Image: ' + img.dataset.ph; img.replaceWith(d); };
  if (img.complete && !img.naturalWidth) swap(); else img.addEventListener('error', swap);
});
document.getElementById('inviteBtn').onclick = async () => {
  const url = 'https://app.jamesalbert.it', title = 'James Albert English Institute®';
  try { if (navigator.share) return await navigator.share({ title, url }); await navigator.clipboard.writeText(url);
    const sp = document.querySelector('#inviteBtn span'); sp.textContent = T(TEXT.copied); setTimeout(() => sp.textContent = T(TEXT.invite), 2000);
  } catch(e){}
};
document.querySelectorAll('#courseTabs button').forEach(b => b.onclick = () => { group = b.dataset.g; renderCourses(); });
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
renderAll();
go('home');
if ('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname.endsWith('jamesalbert.it')) {
  // OneSignal registers /sw.js itself (it also handles offline caching).
}
</script>

function openBook(u){document.getElementById('bkfr').src=u;document.getElementById('bkext').href=u;document.getElementById('bkov').classList.add('on')}
