<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1f3d">
<title>jamesalbert® Library – embed test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0f1f3d;--gold:#c9a24a;--muted:#6b7385}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Poppins,sans-serif;background:#fff;color:#1d2433;-webkit-tap-highlight-color:transparent}
  header{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
  header button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}
  header .t{flex:1;min-width:0}
  header .t b{display:block;font:400 19px 'Playfair Display',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .t small{color:var(--gold);font-size:11.5px;letter-spacing:1px}
  header img{width:38px;height:38px;border-radius:50%;background:#fff}
  #list{padding:18px 16px;display:grid;gap:14px}
  .card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:#f7f1e3;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:0 6px 20px rgba(15,31,61,.10)}
  .card .ic{width:54px;height:70px;border-radius:6px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
  .card b{display:block;font:400 18px 'Playfair Display',serif;color:var(--navy)}
  .card small{color:var(--muted)}
  #reader{position:fixed;inset:0;display:none;flex-direction:column;background:#0c1b3e}
  #reader.on{display:flex}
  #frameWrap{position:relative;flex:1}
  #frameWrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0c1b3e}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;opacity:.8;font-size:14px}
  .note{padding:0 16px 24px;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>

<header>
  <button onclick="history.length>1?history.back():location.href='/'" aria-label="Back">‹</button>
  <div class="t"><b>Book Library</b><small>EMBED TEST · not in the live app</small></div>
  <img src="images/crest-176.png" alt="">
</header>

<div id="list"></div>
<p class="note">Test page: books open inside the app using FlipHTML5 behind the scenes.</p>

<div id="reader">
  <header>
    <button onclick="closeBook()" aria-label="Close book">‹</button>
    <div class="t"><b id="rtitle"></b><small>jamesalbert® Library</small></div>
    <img src="images/crest-176.png" alt="">
  </header>
  <div id="frameWrap"><div id="loading">Opening book…</div><iframe id="frame" allowfullscreen allow="fullscreen; autoplay"></iframe></div>
</div>

<script>
const BOOKS = [
  {title:"The Toys' Party", sub:"Read & listen", link:"https://books.jamesalbert.it/books/The-Toys-Party/"},
  {title:"Home for a Night", sub:"Read & listen", link:"https://books.jamesalbert.it/books/Home-for-a-Night/"}
];
const list = document.getElementById('list'), reader = document.getElementById('reader'), frame = document.getElementById('frame');
BOOKS.forEach(b=>{
  const c=document.createElement('button'); c.className='card';
  c.innerHTML='<span class="ic">📖</span><span><b></b><small></small></span>';
  c.querySelector('b').textContent=b.title; c.querySelector('small').textContent=b.sub;
  c.onclick=()=>openBook(b); list.appendChild(c);
});
function openBook(b){
  document.getElementById('rtitle').textContent=b.title;
  document.getElementById('loading').style.display='flex';
  frame.onload=()=>document.getElementById('loading').style.display='none';
  frame.src=b.link; reader.classList.add('on');
  history.pushState({book:1},'');
}
function closeBook(){ if(history.state&&history.state.book) history.back(); else hide(); }
function hide(){ reader.classList.remove('on'); frame.src='about:blank'; }
addEventListener('popstate',()=>{ if(reader.classList.contains('on')) hide(); });
</script>
</body>
</html>
